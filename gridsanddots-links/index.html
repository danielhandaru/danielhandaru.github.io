<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>grids &amp; dots — Listen</title>
  <meta name="description" content="Stream and follow Grids &amp; Dots on all platforms.">
  <link rel="shortcut icon" type="image/icon" href="img/favicon_3.ico"/>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f0ece4;
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HERO ───────────────────────────────────────────── */
    .hero {
      width: 100%;
      max-width: 480px;
      position: relative;
      overflow: hidden;
    }

    .hero__img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .hero__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.72) 100%
      );
    }

    .hero__label {
      position: absolute;
      top: 18px;
      right: 18px;
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
    }

    /* ── ARTIST INFO ────────────────────────────────────── */
    .artist-info {
      width: 100%;
      max-width: 480px;
      padding: 26px 24px 18px;
      background: #f0ece4;
    }

    .artist-name {
      font-family: 'Oswald', sans-serif;
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: lowercase;
      color: #1b1b1b;
      line-height: 1;
    }

    .artist-name span {
      color: #2ac4b7;
    }

    .artist-tag {
      font-family: 'Open Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      margin-top: 6px;
    }

    /* ── LINKS CARD ─────────────────────────────────────── */
    .links-card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 10px 0 40px;
      margin-top: 4px;
      flex: 1;
    }

    /* ── INDIVIDUAL LINK ROW ────────────────────────────── */
    .link-row {
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #f0ece4;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    .link-row:last-child { border-bottom: none; }

    .link-row:hover,
    .link-row:focus {
      background: #f9f7f4;
      outline: none;
    }

    .link-row__icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      my: 14px;
    }

    .link-row__text {
      flex: 1;
      padding: 18px 0;
    }

    .link-row__platform {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #1b1b1b;
      line-height: 1.1;
    }

    .link-row__action {
      font-family: 'Open Sans', sans-serif;
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
    }

    .link-row__btn {
      flex-shrink: 0;
      background: transparent;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #555;
      padding: 8px 16px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .link-row:hover .link-row__btn {
      border-color: #2ac4b7;
      color: #2ac4b7;
    }

    /* ── FOOTER ─────────────────────────────────────────── */
    .footer {
      width: 100%;
      max-width: 480px;
      background: #fff;
      padding: 10px 24px 30px;
      text-align: center;
    }

    .footer__text {
      font-size: 11px;
      color: #bbb;
      letter-spacing: 1px;
    }

    .footer__text a {
      color: #2ac4b7;
      text-decoration: none;
    }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (min-width: 480px) {
      body { padding-top: 32px; }

      .hero {
        border-radius: 16px 16px 0 0;
        overflow: hidden;
      }

      .links-card { border-radius: 0; }
    }

    @media (max-width: 360px) {
      .artist-name { font-size: 28px; }
      .link-row__btn { padding: 7px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <!-- HERO PHOTO -->

  <!-- FOOTER -->

</body>
</html>
